# Development Environment Configuration

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:punch_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8

  jpa:
    hibernate:
      ddl-auto: update

  # Thymeleaf Configuration
  thymeleaf:
    cache: false

  # DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# P6Spy Configuration (enabled for dev)
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j

# Logging
logging:
  level:
    root: INFO
    com.punch.shop: DEBUG
