<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>장바구니</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">장바구니</h1>

        <!-- 장바구니 비어있음 -->
        <div th:if="${cart.items.isEmpty()}"
             class="text-center py-24 text-gray-400">
            <p class="text-lg mb-4">장바구니가 비어있습니다.</p>
            <a th:href="@{/products}"
               class="inline-block px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm font-medium">
                쇼핑 계속하기
            </a>
        </div>

        <!-- 장바구니 목록 -->
        <div th:unless="${cart.items.isEmpty()}">
            <div class="bg-white rounded-lg border border-gray-200 divide-y divide-gray-100">
                <div th:each="item : ${cart.items}"
                     class="flex items-center gap-4 p-4">

                    <!-- 상품 이미지 -->
                    <a th:href="@{/products/{id}(id=${item.productId})}"
                       class="flex-shrink-0 w-20 h-20 bg-gray-100 rounded-lg overflow-hidden">
                        <img th:if="${item.thumbnailImageUrl}"
                             th:src="${item.thumbnailImageUrl}"
                             th:alt="${item.productName}"
                             class="w-full h-full object-cover">
                        <div th:unless="${item.thumbnailImageUrl}"
                             class="w-full h-full flex items-center justify-center text-gray-400 text-xs">
                            이미지 없음
                        </div>
                    </a>

                    <!-- 상품명 -->
                    <a th:href="@{/products/{id}(id=${item.productId})}"
                       th:text="${item.productName}"
                       class="flex-1 text-sm text-gray-800 hover:text-blue-600 transition line-clamp-2">
                    </a>

                    <!-- 단가 -->
                    <div class="text-sm text-gray-500 w-24 text-right">
                        <span th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')}"></span>원
                    </div>

                    <!-- 수량 변경 -->
                    <form th:action="@{/cart/items/{id}(id=${item.productId})}" method="post"
                          class="flex items-center gap-1">
                        <input type="number" name="quantity"
                               th:value="${item.quantity}"
                               min="1" max="100"
                               class="w-16 text-center border border-gray-300 rounded px-2 py-1 text-sm">
                        <button type="submit"
                                class="px-2 py-1 text-xs text-gray-600 border border-gray-300 rounded hover:bg-gray-50 transition">
                            변경
                        </button>
                    </form>

                    <!-- 소계 -->
                    <div class="text-sm font-semibold text-gray-900 w-28 text-right">
                        <span th:text="${#numbers.formatInteger(item.subtotal, 0, 'COMMA')}"></span>원
                    </div>

                    <!-- 삭제 -->
                    <form th:action="@{/cart/items/{id}/delete(id=${item.productId})}" method="post">
                        <button type="submit"
                                class="text-gray-400 hover:text-red-500 transition text-lg leading-none">
                            &times;
                        </button>
                    </form>
                </div>
            </div>

            <!-- 합계 및 주문 -->
            <div class="mt-6 flex justify-end">
                <div class="bg-white rounded-lg border border-gray-200 p-6 w-full max-w-sm">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-gray-600">총 상품금액</span>
                        <span class="text-xl font-bold text-gray-900">
                            <span th:text="${#numbers.formatInteger(cart.totalPrice, 0, 'COMMA')}"></span>원
                        </span>
                    </div>
                    <button disabled
                            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                        주문하기
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
