<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="bg-white shadow-md">
    <nav class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center">
                <a th:href="@{/}" class="text-2xl font-bold text-blue-600 hover:text-blue-700">
                    Punch
                </a>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 mx-8">
                <form th:action="@{/products}" method="get" class="relative">
                    <input type="text"
                           name="keyword"
                           placeholder="상품을 검색하세요"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit"
                            class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-blue-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- Navigation Links -->
            <div class="flex items-center space-x-6">
                <!-- Cart -->
                <a th:href="@{/cart}" class="flex items-center text-gray-700 hover:text-blue-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <span class="ml-1">장바구니</span>
                </a>

                <!-- User Menu -->
                <div sec:authorize="isAuthenticated()" class="flex items-center space-x-4">
                    <a th:href="@{/member/profile}" class="text-gray-700 hover:text-blue-600">
                        <span sec:authentication="principal.name">사용자</span>님
                    </a>
                    <a th:href="@{/orders}" class="text-gray-700 hover:text-blue-600">주문내역</a>
                    <form th:action="@{/member/logout}" method="post" class="inline">
                        <button type="submit" class="text-gray-700 hover:text-blue-600">로그아웃</button>
                    </form>
                </div>

                <!-- Login/Register -->
                <div sec:authorize="isAnonymous()" class="flex items-center space-x-4">
                    <a th:href="@{/member/login}" class="text-gray-700 hover:text-blue-600">로그인</a>
                    <a th:href="@{/member/register}"
                       class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        회원가입
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
