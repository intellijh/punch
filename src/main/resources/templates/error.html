<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${status} + ' - 오류'">오류</title>
    <th:block th:if="${status == 999}">
        <meta http-equiv="refresh" th:content="'0;url=' + @{/}"/>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto px-4 py-16">
        <div class="max-w-2xl mx-auto text-center">
            <div class="mb-8">
                <svg class="w-24 h-24 mx-auto text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>

            <h1 class="text-6xl font-bold text-gray-800 mb-4" th:text="${status}">500</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4" th:text="${error}">Internal Server Error</h2>
            <p class="text-gray-600 mb-8" th:text="${message}">서버 내부 오류가 발생했습니다.</p>

            <div class="space-y-4">
                <a th:href="@{/}"
                   class="inline-block px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition">
                    홈으로 돌아가기
                </a>
                <div>
                    <button onclick="history.back()"
                            class="text-blue-600 hover:text-blue-700 font-medium">
                        이전 페이지로
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
