<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${addressId} ? '배송지 수정' : '배송지 추가'">배송지</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center"
                th:text="${addressId} ? '배송지 수정' : '배송지 추가'">배송지</h1>

            <!-- 추가 폼 -->
            <form th:if="${addressCreateRequest}"
                  th:action="@{/member/address/new}"
                  th:object="${addressCreateRequest}"
                  method="post"
                  class="space-y-4">

                <th:block th:replace="~{::fields}"></th:block>

                <div class="pt-4 flex gap-3">
                    <a th:href="@{/member/address}"
                       class="flex-1 text-center bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition">
                        취소
                    </a>
                    <button type="submit"
                            class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                        추가하기
                    </button>
                </div>
            </form>

            <!-- 수정 폼 -->
            <form th:if="${addressUpdateRequest}"
                  th:action="@{/member/address/{id}/edit(id=${addressId})}"
                  th:object="${addressUpdateRequest}"
                  method="post"
                  class="space-y-4">

                <input type="hidden" name="redirectUrl" th:value="${redirectUrl}">

                <th:block th:replace="~{::fields}"></th:block>

                <div class="pt-4 flex gap-3">
                    <a th:href="@{/member/address}"
                       class="flex-1 text-center bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition">
                        취소
                    </a>
                    <button type="submit"
                            class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                        수정하기
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 폼 필드 프래그먼트 -->
<th:block th:fragment="fields">
    <div>
        <label for="label" class="block text-sm font-medium text-gray-700 mb-2">배송지명</label>
        <input type="text" id="label" th:field="*{label}"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
               placeholder="집, 회사, 부모님댁">
        <p th:if="${#fields.hasErrors('label')}" th:errors="*{label}"
           class="mt-1 text-sm text-red-600"></p>
    </div>

    <div>
        <label for="recipientName" class="block text-sm font-medium text-gray-700 mb-2">수령인</label>
        <input type="text" id="recipientName" th:field="*{recipientName}"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
               placeholder="홍길동">
        <p th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}"
           class="mt-1 text-sm text-red-600"></p>
    </div>

    <div>
        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">전화번호</label>
        <input type="text" id="phone" th:field="*{phone}" data-phone
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
               placeholder="010-1234-5678"
               maxlength="13">
        <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"
           class="mt-1 text-sm text-red-600"></p>
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">우편번호</label>
        <div class="flex gap-2">
            <input type="text" id="zipCode" th:field="*{zipCode}"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 cursor-default"
                   placeholder="우편번호" readonly>
            <button type="button" onclick="openKakaoPostcode()"
                    class="flex-shrink-0 px-4 py-2 bg-yellow-400 text-gray-900 text-sm font-medium rounded-lg hover:bg-yellow-500 transition cursor-pointer">
                주소 검색
            </button>
        </div>
        <p th:if="${#fields.hasErrors('zipCode')}" th:errors="*{zipCode}"
           class="mt-1 text-sm text-red-600"></p>
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">주소</label>
        <input type="text" id="address" th:field="*{address}"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 cursor-default"
               placeholder="주소 검색으로 입력해주세요" readonly>
        <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}"
           class="mt-1 text-sm text-red-600"></p>
    </div>

    <div>
        <label for="addressDetail" class="block text-sm font-medium text-gray-700 mb-2">
            상세 주소 <span class="text-gray-400 text-xs">(선택)</span>
        </label>
        <input type="text" id="addressDetail" th:field="*{addressDetail}"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
               placeholder="101동 1001호">
    </div>
</th:block>

<th:block layout:fragment="extra-js">
<script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    function openKakaoPostcode() {
        new kakao.Postcode({
            oncomplete: function(data) {
                document.getElementById('zipCode').value = data.zonecode;
                document.getElementById('address').value = data.roadAddress || data.jibunAddress;
                document.getElementById('addressDetail').focus();
            }
        }).open();
    }
</script>
</th:block>
</body>
</html>
