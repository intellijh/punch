<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>프로필</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">프로필</h1>

            <!-- 성공 메시지 -->
            <div th:if="${message}" th:text="${message}"
                 class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm">
            </div>

            <form th:action="@{/member/profile}" th:object="${memberProfileUpdateRequest}" method="post" class="space-y-4">

                <!-- 이메일 (읽기 전용) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">이메일</label>
                    <input type="text"
                           th:value="${profile.email}"
                           class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-500 cursor-not-allowed"
                           readonly>
                </div>

                <!-- 이름 -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">이름</label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="홍길동">
                    <p th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- 전화번호 -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">전화번호</label>
                    <input type="text"
                           id="phone"
                           th:field="*{phone}"
                           data-phone
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="010-1234-5678">
                    <p th:if="${#fields.hasErrors('phone')}"
                       th:errors="*{phone}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- 버튼 -->
                <div class="pt-4">
                    <button type="submit"
                            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                        수정하기
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
