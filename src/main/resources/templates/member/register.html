<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>회원가입</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">회원가입</h1>

            <form th:action="@{/member/register}" th:object="${memberRegisterRequest}" method="post" class="space-y-4">
                <!-- 이메일 -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">이메일</label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="example@email.com"
                           maxlength="100">
                    <p th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="8자 이상 입력해주세요">
                    <p th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- 이름 -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">이름</label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="홍길동">
                    <p th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- 전화번호 -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">전화번호</label>
                    <input type="text"
                           id="phone"
                           th:field="*{phone}"
                           data-phone
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="010-1234-5678"
                           maxlength="13">
                    <p th:if="${#fields.hasErrors('phone')}"
                       th:errors="*{phone}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- 버튼 -->
                <div class="pt-4">
                    <button type="submit"
                            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                        가입하기
                    </button>
                </div>

                <!-- 로그인 링크 -->
                <div class="text-center mt-4">
                    <p class="text-sm text-gray-600">
                        이미 계정이 있으신가요?
                        <a th:href="@{/member/login}" class="text-blue-600 hover:text-blue-700 font-medium">
                            로그인
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
