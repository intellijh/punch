<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>배송지 관리</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-2xl mx-auto">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-3xl font-bold text-gray-800">배송지 관리</h1>
                <a th:href="@{/member/address/new}"
                   class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition text-sm">
                    배송지 추가
                </a>
            </div>

            <!-- 성공 메시지 -->
            <div th:if="${message}" th:text="${message}"
                 class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm">
            </div>

            <!-- 오류 메시지 -->
            <div th:if="${error}" th:text="${error}"
                 class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm">
            </div>

            <!-- 배송지 없음 -->
            <div th:if="${#lists.isEmpty(addresses)}"
                 class="text-center py-16 text-gray-500">
                <p class="text-lg mb-4">등록된 배송지가 없습니다.</p>
                <a th:href="@{/member/address/new}"
                   class="text-blue-600 hover:underline font-medium">배송지 추가하기</a>
            </div>

            <!-- 배송지 목록 -->
            <div class="space-y-4">
                <div th:each="address : ${addresses}"
                     class="bg-white rounded-lg shadow p-5 border border-gray-200">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-2 mb-2">
                            <span th:text="${address.label}"
                                  class="font-semibold text-gray-800 text-lg"></span>
                            <span th:if="${address.defaultAddress}"
                                  class="bg-blue-100 text-blue-700 text-xs font-medium px-2 py-0.5 rounded-full">
                                기본
                            </span>
                        </div>
                        <div class="flex gap-2">
                            <form th:unless="${address.defaultAddress}"
                                  th:action="@{/member/address/{id}/default(id=${address.id})}"
                                  method="post">
                                <button type="submit"
                                        class="text-xs text-blue-600 hover:underline border border-blue-300 px-2 py-1 rounded">
                                    기본으로 설정
                                </button>
                            </form>
                            <a th:href="@{/member/address/{id}/edit(id=${address.id})}"
                               class="text-xs text-gray-600 hover:underline border border-gray-300 px-2 py-1 rounded">
                                수정
                            </a>
                            <form th:action="@{/member/address/{id}/delete(id=${address.id})}"
                                  method="post"
                                  onsubmit="return confirm('배송지를 삭제하시겠습니까?')">
                                <button type="submit"
                                        class="text-xs text-red-600 hover:underline border border-red-300 px-2 py-1 rounded">
                                    삭제
                                </button>
                            </form>
                        </div>
                    </div>
                    <p class="text-gray-700">
                        <span th:text="${address.recipientName}"></span>
                        &nbsp;·&nbsp;
                        <span th:text="${address.phone}"></span>
                    </p>
                    <p class="text-gray-600 text-sm mt-1">
                        [<span th:text="${address.zipCode}"></span>]
                        <span th:text="${address.address}"></span>
                        <span th:if="${address.addressDetail}" th:text="${address.addressDetail}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
