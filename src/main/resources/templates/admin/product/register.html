<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>상품 등록</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">상품 등록</h1>

        <form th:action="@{/admin/products}" th:object="${productCreateRequest}"
              method="post" enctype="multipart/form-data">

            <div class="bg-white rounded-lg border border-gray-200 p-6 space-y-5">

                <!-- 글로벌 에러 (이미지 미업로드 등) -->
                <div th:if="${#fields.hasGlobalErrors()}" class="p-3 bg-red-50 border border-red-200 rounded-lg">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="text-sm text-red-600"></p>
                </div>

                <!-- 상품명 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">상품명 <span class="text-red-500">*</span></label>
                    <input type="text" th:field="*{name}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="상품명을 입력해주세요">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- 설명 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">상품 설명</label>
                    <textarea th:field="*{description}" rows="4"
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                              placeholder="상품 설명을 입력해주세요"></textarea>
                </div>

                <!-- 가격 / 재고 -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">가격 <span class="text-red-500">*</span></label>
                        <input type="number" th:field="*{price}" min="1"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="0">
                        <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="mt-1 text-sm text-red-600"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">재고 <span class="text-red-500">*</span></label>
                        <input type="number" th:field="*{stockQuantity}" min="0"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="0">
                        <p th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}" class="mt-1 text-sm text-red-600"></p>
                    </div>
                </div>

                <!-- 카테고리 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">카테고리 <span class="text-red-500">*</span></label>
                    <select th:field="*{categoryId}"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white">
                        <option value="">카테고리 선택</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                    <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- 이미지 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">상품 이미지 <span class="text-red-500">*</span></label>
                    <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition">
                        <div id="imagePreview" class="flex flex-col items-center justify-center">
                            <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <span class="text-sm text-gray-500">클릭하여 이미지를 선택해주세요</span>
                        </div>
                        <input type="file" name="image" accept="image/*" class="hidden" onchange="previewImage(this)">
                    </label>
                </div>

                <button type="submit"
                        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                    상품 등록
                </button>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="extra-js">
<script>
    function previewImage(input) {
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.innerHTML = '<img src="' + e.target.result + '" class="max-h-36 rounded-lg object-contain">';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</th:block>
</body>
</html>
