<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${product.name}">상품 상세</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto px-4 py-8">

        <!-- 브레드크럼 -->
        <nav class="text-sm text-gray-500 mb-6">
            <a th:href="@{/products}" class="hover:text-blue-600 transition">전체 상품</a>
            <span class="mx-2">›</span>
            <span th:text="${product.categoryName}" class="text-gray-700"></span>
        </nav>

        <div class="bg-white rounded-lg border border-gray-200 p-6 lg:p-8">
            <div class="flex flex-col lg:flex-row gap-8">

                <!-- 상품 이미지 -->
                <div class="lg:w-2/5">
                    <div class="aspect-square bg-gray-100 rounded-lg overflow-hidden">
                        <img th:if="${product.thumbnailImageUrl}"
                             th:src="${product.thumbnailImageUrl}"
                             th:alt="${product.name}"
                             class="w-full h-full object-cover">
                        <div th:unless="${product.thumbnailImageUrl}"
                             class="w-full h-full flex items-center justify-center text-gray-400">
                            이미지 없음
                        </div>
                    </div>
                </div>

                <!-- 상품 정보 -->
                <div class="lg:w-3/5 flex flex-col gap-4">
                    <div>
                        <p th:text="${product.categoryName}"
                           class="text-sm text-gray-400 mb-1"></p>
                        <h1 th:text="${product.name}"
                            class="text-2xl font-bold text-gray-900 leading-snug"></h1>
                    </div>

                    <div class="border-t border-gray-100 pt-4">
                        <p class="text-3xl font-bold text-gray-900">
                            <span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')}"></span>원
                        </p>
                    </div>

                    <!-- 품절 표시 -->
                    <div th:if="${product.stockQuantity <= 0}">
                        <span class="inline-block px-3 py-1 bg-red-100 text-red-600 text-sm rounded-full">
                            품절
                        </span>
                    </div>

                    <!-- 장바구니 버튼 -->
                    <div class="mt-auto pt-4">
                        <form th:if="${product.stockQuantity > 0}"
                              th:action="@{/cart/items}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <div class="flex items-center gap-3 mb-4">
                                <label class="text-sm text-gray-600">수량</label>
                                <input type="number" name="quantity" value="1"
                                       min="1" th:max="${product.stockQuantity}"
                                       class="w-20 text-center border border-gray-300 rounded px-2 py-2 text-sm">
                                <span class="text-sm text-gray-400">
                                    (최대 <span th:text="${product.stockQuantity}"></span>개)
                                </span>
                            </div>
                            <button type="submit"
                                    class="w-full bg-blue-600 text-white py-4 rounded-lg font-semibold text-lg transition hover:bg-blue-700">
                                장바구니 담기
                            </button>
                        </form>
                        <div th:unless="${product.stockQuantity > 0}">
                            <button disabled
                                    class="w-full bg-gray-400 text-white py-4 rounded-lg font-semibold text-lg cursor-not-allowed">
                                품절
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 상품 설명 -->
            <div th:if="${product.description}" class="mt-8 border-t border-gray-100 pt-8">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">상품 설명</h2>
                <p th:text="${product.description}"
                   class="text-gray-600 leading-relaxed whitespace-pre-line"></p>
            </div>
        </div>

        <!-- 목록으로 -->
        <div class="mt-6">
            <a th:href="@{/products}"
               onclick="if (history.length > 1) { history.back(); return false; }"
               class="text-sm text-gray-500 hover:text-gray-700 transition">
                ← 목록으로
            </a>
        </div>
    </div>
</div>
</body>
</html>
