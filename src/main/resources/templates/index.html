<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>홈</title>
</head>
<body>
<div layout:fragment="content">
    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-blue-600 to-blue-800 text-white py-16">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl">
                <h1 class="text-4xl md:text-5xl font-bold mb-4">
                    빠르고 편리한 온라인 쇼핑
                </h1>
                <p class="text-xl mb-8">
                    Punch에서 원하는 모든 것을 찾아보세요
                </p>
                <a th:href="@{/products}"
                   class="inline-block px-8 py-3 bg-white text-blue-600 font-semibold rounded-lg hover:bg-gray-100 transition">
                    쇼핑 시작하기
                </a>
            </div>
        </div>
    </section>

    <!-- Categories Section -->
    <section class="container mx-auto px-4 py-12">
        <h2 class="text-2xl font-bold mb-6">카테고리별 쇼핑</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
            <a th:each="category : ${categories}"
               th:href="@{/products(categoryId=${category.id})}"
               class="flex flex-col items-center p-6 bg-white rounded-lg shadow hover:shadow-lg transition">
                <th:block th:switch="${category.name}">
                    <!-- 가전/디지털 -->
                    <svg th:case="'가전/디지털'" class="w-12 h-12 text-blue-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <!-- 패션/의류 -->
                    <svg th:case="'패션/의류'" class="w-12 h-12 text-blue-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                    </svg>
                    <!-- 식품 -->
                    <svg th:case="'식품'" class="w-12 h-12 text-blue-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <!-- 뷰티 -->
                    <svg th:case="'뷰티'" class="w-12 h-12 text-blue-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                    </svg>
                    <!-- 스포츠/레저 -->
                    <svg th:case="'스포츠/레저'" class="w-12 h-12 text-blue-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </th:block>
                <span class="text-sm font-medium text-gray-700" th:text="${category.name}"></span>
            </a>
        </div>
    </section>

    <!-- Featured Products Section -->
    <section class="bg-gray-100 py-12">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">추천 상품</h2>
                <a th:href="@{/products}" class="text-blue-600 hover:text-blue-700 font-medium">
                    전체보기 →
                </a>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Product Card Placeholder -->
                <div class="bg-white rounded-lg shadow hover:shadow-lg transition overflow-hidden">
                    <div class="aspect-square bg-gray-200 flex items-center justify-center">
                        <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div class="p-4">
                        <h3 class="font-semibold text-gray-800 mb-2">상품이 곧 추가됩니다</h3>
                        <p class="text-sm text-gray-600 mb-2">다양한 상품을 준비중입니다</p>
                        <div class="flex items-center justify-between">
                            <span class="text-lg font-bold text-blue-600">₩0</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow hover:shadow-lg transition overflow-hidden">
                    <div class="aspect-square bg-gray-200 flex items-center justify-center">
                        <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div class="p-4">
                        <h3 class="font-semibold text-gray-800 mb-2">상품이 곧 추가됩니다</h3>
                        <p class="text-sm text-gray-600 mb-2">다양한 상품을 준비중입니다</p>
                        <div class="flex items-center justify-between">
                            <span class="text-lg font-bold text-blue-600">₩0</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow hover:shadow-lg transition overflow-hidden">
                    <div class="aspect-square bg-gray-200 flex items-center justify-center">
                        <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div class="p-4">
                        <h3 class="font-semibold text-gray-800 mb-2">상품이 곧 추가됩니다</h3>
                        <p class="text-sm text-gray-600 mb-2">다양한 상품을 준비중입니다</p>
                        <div class="flex items-center justify-between">
                            <span class="text-lg font-bold text-blue-600">₩0</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow hover:shadow-lg transition overflow-hidden">
                    <div class="aspect-square bg-gray-200 flex items-center justify-center">
                        <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div class="p-4">
                        <h3 class="font-semibold text-gray-800 mb-2">상품이 곧 추가됩니다</h3>
                        <p class="text-sm text-gray-600 mb-2">다양한 상품을 준비중입니다</p>
                        <div class="flex items-center justify-between">
                            <span class="text-lg font-bold text-blue-600">₩0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Benefits Section -->
    <section class="container mx-auto px-4 py-12">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="flex items-start space-x-4">
                <div class="flex-shrink-0">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                </div>
                <div>
                    <h3 class="font-semibold text-lg mb-2">빠른 배송</h3>
                    <p class="text-gray-600 text-sm">오늘 주문하면 내일 도착하는 로켓배송</p>
                </div>
            </div>

            <div class="flex items-start space-x-4">
                <div class="flex-shrink-0">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                    </div>
                </div>
                <div>
                    <h3 class="font-semibold text-lg mb-2">안전한 결제</h3>
                    <p class="text-gray-600 text-sm">믿을 수 있는 결제 시스템으로 안전하게</p>
                </div>
            </div>

            <div class="flex items-start space-x-4">
                <div class="flex-shrink-0">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                        </svg>
                    </div>
                </div>
                <div>
                    <h3 class="font-semibold text-lg mb-2">무료 반품</h3>
                    <p class="text-gray-600 text-sm">30일 이내 무료 반품 및 교환 가능</p>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
