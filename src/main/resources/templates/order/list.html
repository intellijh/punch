<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>주문 내역</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">주문 내역</h1>

        <!-- 주문 없음 -->
        <div th:unless="${orders.hasContent()}"
             class="text-center py-24 text-gray-400">
            <p class="text-lg mb-4">주문 내역이 없습니다.</p>
            <a th:href="@{/products}"
               class="inline-block px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm font-medium">
                쇼핑하러 가기
            </a>
        </div>

        <!-- 주문 목록 -->
        <div th:if="${orders.hasContent()}" class="space-y-4">
            <a th:each="order : ${orders.content}"
               th:href="@{/orders/{id}(id=${order.orderId})}"
               class="block bg-white rounded-lg border border-gray-200 p-5 hover:border-blue-400 transition">
                <div class="flex items-start justify-between mb-3">
                    <div>
                        <p class="text-xs text-gray-400 mb-1">
                            주문번호 <span th:text="${order.orderId}"></span>
                        </p>
                        <p class="text-sm text-gray-500">
                            <span th:text="${#temporals.format(order.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
                        </p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs font-semibold"
                          th:classappend="${order.status.name() == 'PAID'} ? 'bg-blue-100 text-blue-700' :
                                           (${order.status.name() == 'SHIPPING'} ? 'bg-yellow-100 text-yellow-700' :
                                           (${order.status.name() == 'DELIVERED'} ? 'bg-green-100 text-green-700' :
                                           'bg-gray-100 text-gray-600'))"
                          th:text="${order.statusDescription}">
                    </span>
                </div>
                <div class="flex items-center justify-between">
                    <p class="text-sm text-gray-800">
                        <span th:text="${order.firstItemName}"></span>
                        <span th:if="${order.itemCount > 1}"
                              class="text-gray-500"
                              th:text="${' 외 ' + (order.itemCount - 1) + '건'}"></span>
                    </p>
                    <p class="font-semibold text-gray-900">
                        <span th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')}"></span>원
                    </p>
                </div>
            </a>

            <!-- 페이지네이션 -->
            <div th:if="${orders.totalPages > 1}"
                 class="flex justify-center items-center gap-3 mt-10 text-sm text-gray-600">
                <a th:if="${!orders.first}"
                   th:href="@{/orders(page=${orders.number - 1})}"
                   class="px-4 py-2 rounded border border-gray-300 hover:bg-gray-50 transition">
                    이전
                </a>
                <span th:text="${orders.number + 1} + ' / ' + ${orders.totalPages}"
                      class="text-gray-500"></span>
                <a th:if="${!orders.last}"
                   th:href="@{/orders(page=${orders.number + 1})}"
                   class="px-4 py-2 rounded border border-gray-300 hover:bg-gray-50 transition">
                    다음
                </a>
            </div>
        </div>

    </div>
</div>
</body>
</html>
