# Production Environment Configuration

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8

  jpa:
    hibernate:
      ddl-auto: validate

  # Thymeleaf Configuration
  thymeleaf:
    cache: true

  # DevTools
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

# P6Spy Configuration (disabled for production performance)
decorator:
  datasource:
    p6spy:
      enable-logging: false

# Logging
logging:
  level:
    root: WARN
    com.punch.shop: INFO
