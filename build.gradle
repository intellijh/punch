plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.punch'
version = '0.0.1-SNAPSHOT'
description = 'E-commerce application inspired by Coupang'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	implementation 'com.azure:azure-storage-blob:12.28.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Tailwind CSS 빌드 태스크
tasks.register('buildTailwind', Exec) {
	description = 'Build Tailwind CSS'
	group = 'build'

	commandLine 'cmd', '/c', 'npm', 'run', 'build:css'

	inputs.files(
		fileTree('src/main/resources/templates'),
		fileTree('src/main/resources/static/js'),
		file('src/main/resources/static/css/input.css')
	)
	outputs.file('src/main/resources/static/css/style.css')

	// 태스크 항상 실행
	outputs.upToDateWhen { false }
}

// processResources 전에 Tailwind 빌드 실행
tasks.named('processResources') {
	dependsOn 'buildTailwind'
}
